url-latency-benchmark = GB, server-tag-regex=(?<![A-Za-z\d]|\d\s)(?:GBR?|UK)(?![A-Za-z])|Britain|British|United\s?Kingdom|London|英國|英国|英(?![\u4E00-\u9FFF])
