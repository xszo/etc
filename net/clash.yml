    behavior: domain
    format: text
    interval: 86400
    type: http
    url: https://cdn.jsdelivr.net/gh/xszo/cr/rule/cn-dn-c.yml
  dnjp:
    behavior: domain
    format: text
    interval: 86400
    type: http
    url: https://cdn.jsdelivr.net/gh/xszo/cr/rule/jp-dn-c.yml
  dnsystem:
    behavior: domain
