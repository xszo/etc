- filter: ^
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: Node
  type: url-test
  url: http://1.1.1.1/
  use: &id001 []
- filter: "(?<![A-Za-z])CH?N(?![A-Za-z])|China|Shenzhen|Shanghai|\u4E2D\u570B|\u4E2D\
    \u56FD|\u4E2D(?![\\u4E00-\\u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: CN
  type: url-test
  url: http://1.1.1.1/
  use: *id001
- filter: "(?<![A-Za-z])DEU?(?![A-Za-z])|Deutsch|Germany?|Berlin|\u5FB7\u570B|\u5FB7\
    \u56FD|\u5FB7(?![\\u4E00-\\u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: DE
  type: url-test
  url: http://1.1.1.1/
  use: *id001
- filter: "(?<![A-Za-z])FRA?(?![A-Za-z])|France|French|Paris|\u6CD5\u570B|\u6CD5\u56FD\
    |\u6CD5(?![\\u4E00-\\u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: FR
  type: url-test
  url: http://1.1.1.1/
  use: *id001
- filter: "(?<![A-Za-z\\d]|\\d\\s)(?:GBR?|UK)(?![A-Za-z])|Britain|British|United\\\
    s?Kingdom|London|\u82F1\u570B|\u82F1\u56FD|\u82F1(?![\\u4E00-\\u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: GB
  type: url-test
  url: http://1.1.1.1/
  use: *id001
- filter: "(?<![A-Za-z])HKG?(?![A-Za-z])|Hong\\s?Kong|\u9999\u6E2F|\u6E2F(?![\\u4E00-\\\
    u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: HK
  type: url-test
  url: http://1.1.1.1/
  use: *id001
- filter: "(?<![A-Za-z])JPN?(?![A-Za-z])|Japan|Japanese|Tokyo|Osaka|\u65E5\u672C\u570B\
    ?|(?<!\u5C3C)\u65E5(?![\\u4E00-\\u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: JP
  type: url-test
  url: http://1.1.1.1/
  use: *id001
- filter: "(?<![A-Za-z])KO?R(?![A-Za-z])|Korean?|Seoul|\u97D3\u570B|\u97E9\u56FD|\u97E9\
    (?![\\u4E00-\\u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: KR
  type: url-test
  url: http://1.1.1.1/
  use: *id001
- filter: "(?<![A-Za-z])NLD?(?![A-Za-z])|Netherlands|Holland|Amsterdam|\u8377\u862D\
    |\u8377\u5170|\u8377(?![\\u4E00-\\u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: NL
  type: url-test
  url: http://1.1.1.1/
  use: *id001
- filter: "(?<![A-Za-z])SGP?(?![A-Za-z])|Singapore|\u65B0\u52A0\u5761|\u7345\u57CE\
    |\u72EE\u57CE|\u65B0(?![\\u4E00-\\u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: SG
  type: url-test
  url: http://1.1.1.1/
  use: *id001
- filter: "(?<![A-Za-z])TWN?(?![A-Za-z])|Taiwan|Taiwanese|Taipei|\u53F0\u7063|\u53F0\
    \u6E7E|\u53F0(?![\\u4E00-\\u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: TW
  type: url-test
  url: http://1.1.1.1/
  use: *id001
- filter: "(?<![A-Za-z])(?:USA?|NY|LA)(?![A-Za-z])|United\\s?States|American?|\u7F8E\
    \u570B|\u7F8E\u56FD|\u7F8E(?![\\u4E00-\\u9FFF])"
  hidden: true
  include-all: true
  interval: 600
  lazy: true
  name: US
  type: url-test
  url: http://1.1.1.1/
  use: *id001
proxy-providers: {}
redir-port: 7893
rule-providers:
