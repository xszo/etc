allow-lan: true
bind-address: '*'
dns:
  default-nameserver:
  - 223.5.5.5
  - 223.6.6.6
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
  - +.lan
  - +.local
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:53
  nameserver:
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    captive.apple.com: 1.1.1.1
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
external-controller: 0.0.0.0:9090
geo-auto-update: true
geodata-mode: false
ipv6: true
log-level: warning
mixed-port: 7892
mode: rule
ntp:
  enable: true
  interval: 60
  port: 123
  server: time.cloudflare.com
  write-to-system: false
port: 7890
profile:
  store-fake-ip: true
  store-selected: true
  tracing: false
proxy-groups:
