    type: http
    url: https://cdn.jsdelivr.net/gh/xszo/cr/rule/world-ip-s.txt
rules:
- RULE-SET, dnsystem, System
- RULE-SET, dncn, R-CN
- RULE-SET, dnjp, R-JP
- RULE-SET, dntw, R-TW
- RULE-SET, dnus, R-US
- RULE-SET, dnworld, Default
- RULE-SET, ipsystem, System
- RULE-SET, ipcn, R-CN
- RULE-SET, ipjp, R-JP
- RULE-SET, iptw, R-TW
- RULE-SET, ipworld, Default
- MATCH, Default
secret: '00000000'
sniffer:
  enable: true
  force-dns-mapping: true
  override-destination: false
  parse-pure-ip: true
socks-port: 7891
tcp-concurrent: true
tproxy-port: 7894
tun:
  auto-detect-interface: true
  auto-redir: true
  auto-route: true
  dns-hijack:
  - udp://any:53
  - tcp://any:53
  enable: true
  stack: system
unified-delay: true
